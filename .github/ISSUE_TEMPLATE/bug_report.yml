name: Bug report
description: Something is broken, crashing, or behaving incorrectly on a device
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Gothwad Launcher runs on TV boxes and set-top
        boxes whose firmware differs far more than phone firmware does, so the device details below
        are **not** optional boilerplate — they usually decide whether a bug is reproducible.

        Before filing, check [docs/TROUBLESHOOTING.md](https://github.com/GothwadTech/launcher/blob/main/docs/TROUBLESHOOTING.md):
        boot ads, safe-mode toasts, giant/tiny UI, "app lock doesn't work from recents", "Quick
        Dashboard says Remote: unknown" and self-update install failures are all covered there.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences describing the incorrect behaviour.
      placeholder: After the box wakes from standby, the home grid is empty until I press Back.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact sequence. Include anything you pressed on the remote.
      placeholder: |
        1. Set the launcher as default home
        2. Press power to standby
        3. Press power to wake
        4. Grid is empty
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device, Android version and build
      description: |
        The box/TV model (not "an Android TV") plus Settings → About. Include the firmware or
        build number if you can find it — it often decides whether a bug is reproducible.
      placeholder: Xiaomi Mi Box S 2nd gen, Android 11, build QTG1.200615.002
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How was the launcher installed?
      description: Debug and release builds are signed with different keys and behave differently on update.
      options:
        - GitHub Release APK (signed release)
        - Google Play Store
        - F-Droid
        - Self-built debug APK (./gradlew assembleDebug)
        - Self-built release APK (-PlocalSign or own keystore)
        - Pre-installed by the vendor
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Launcher version
      description: Settings → About shows it.
      placeholder: 1.0.6 (versionCode 10006)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area is affected?
      multiple: true
      options:
        - Home grid / app list
        - Status bar
        - Wallpapers & appearance
        - App lock / hidden apps (vault)
        - Quick Dashboard
        - Search / voice search
        - Settings sheet
        - Remote button mapping
        - Boot behaviour / boot ads / watchdog
        - Self-update
        - Performance / memory / crashes
        - Other

  - type: dropdown
    id: a11y
    attributes:
      label: Is the accessibility service enabled?
      description: "Settings → Accessibility → Gothwad Launcher. Lock enforcement outside the home grid depends on it."
      options:
        - "Yes"
        - "No"
        - "It turns itself off after a reboot"
        - "Not sure how to check"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run these and paste the output inside the code fences. `run-as` needs a debuggable build.

        ```
        adb shell run-as com.gothwad.launcher cat files/gothwad_crash.log
        adb logcat -d | grep -iE "gothwad|AndroidRuntime"
        ```
      render: shell

  - type: textarea
    id: media
    attributes:
      label: Screen recording or photos
      description: |
        For anything visual (rendering, scaling, flicker, overlays) a photo of the TV is more useful
        than a description. Drag files in here.

  - type: checkboxes
    id: terms
    attributes:
      label: Final checks
      options:
        - label: I checked docs/TROUBLESHOOTING.md and this is not already covered there
          required: true
        - label: I searched existing issues (open and closed) for this symptom
          required: true
        - label: This report contains no credentials, PINs or reveal codes
          required: true
