name: Feature request
description: Suggest a new capability or an improvement
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [docs/ROADMAP.md](https://github.com/GothwadTech/launcher/blob/main/docs/ROADMAP.md)
        first — your idea may already be scoped there, including the reason it has not been built
        yet. Note the explicit non-goals: Jetpack Compose, cloud sync or accounts, analytics, and
        content widgets (weather, scores) will not be accepted.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution. "I can't reach X from the couch" beats "add a button".
      placeholder: After the box wakes from standby I have to scroll the whole grid to find the app I was using.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour you want, including where it lives in the UI and how it is reached with a remote.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered or workarounds you use today
      description: Include other launchers or apps that do this well, and what they do differently.

  - type: dropdown
    id: area
    attributes:
      label: Which area would this touch?
      multiple: true
      options:
        - Home grid / app list
        - Status bar
        - Wallpapers & appearance
        - App lock / hidden apps (vault)
        - Quick Dashboard
        - Search / voice search
        - Settings sheet
        - Remote button mapping
        - Boot behaviour / watchdog
        - Self-update
        - Performance / memory
        - New area entirely

  - type: dropdown
    id: cost
    attributes:
      label: What would this cost on a 2 GB box?
      description: |
        Every feature pays in memory, startup time or a new permission. Being honest here speeds up
        triage considerably — "I don't know" is a fine answer.
      options:
        - No new permission, no measurable memory or startup cost
        - Needs a new permission (say which in the notes)
        - Needs extra memory or a bigger startup path
        - Needs network access beyond the existing update check
        - I don't know
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Permissions required, firmware quirks you have seen, mockups, links.

  - type: checkboxes
    id: terms
    attributes:
      label: Final checks
      options:
        - label: I checked docs/ROADMAP.md and this is not already listed or explicitly a non-goal
          required: true
        - label: I searched existing issues (open and closed) for this request
          required: true
        - label: This feature can be built with native Android Views — no Jetpack Compose
          required: true
