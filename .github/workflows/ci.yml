name: CI

# Builds and tests every push and pull request. This is the project's real compiler —
# the sources are often edited in environments without an Android SDK, so green here is
# the bar for merging.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The custom `debugConfig` signing config is not auto-generated by AGP —
      # every workflow that runs assembleDebug must create this keystore first.
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Static resource checks
        run: |
          python3 tools/ktcheck.py
          python3 tools/check_resources.py

      # gradlew is checked in without the exec bit on some checkouts.
      # Gradle output is mirrored into check-run annotations (::error lines) because
      # raw job logs are not reachable from every dev environment.
      - name: Assemble debug
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log || {
            grep -E "^e: |error:|FAILED|What went wrong" -A 3 /tmp/build.log | head -60 | \
              while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log || {
            grep -E "^e: |FAILED|tests? (completed|failed)|What went wrong" -A 3 /tmp/test.log | head -60 | \
              while IFS= read -r line; do echo "::error::${line}"; done
            grep -rl "failure" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -5 | \
              while IFS= read -r f; do grep -o 'message="[^"]*"' "$f" | head -3; done | \
              while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble release (minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/**
          retention-days: 14
