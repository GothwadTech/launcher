name: CI

# Verification build: runs on every pull request and on every push to main.
# This is the workflow that answers "does it still compile, do the tests pass, does lint
# regress, and does the *release* (R8 + resource shrinking) build still succeed".
# Signed release publishing lives in release.yml (tags) and build_apk.yml (manual).

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR replaces the in-flight run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test, lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fast static checks that need no JDK and no Android SDK, so a truncated source
      # file or a dangling resource reference fails in seconds instead of after the
      # Gradle download. See tools/ and docs/I18N.md.
      - name: Static checks (balance + resource references)
        run: |
          python3 tools/ktcheck.py app/src
          python3 tools/check_resources.py app/src/main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # app/build.gradle.kts signs debug builds with a custom "debugConfig" that points at
      # ~/.android/debug.keystore. AGP only auto-generates the keystore for its *own* default
      # debug config, so without this step every build fails with "Keystore file ... not found".
      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # assembleRelease is part of verification on purpose: release has
      # isMinifyEnabled + isShrinkResources on, and R8 is where missing keep rules and
      # stripped resources show up. Without KEYSTORE_FILE the output stays unsigned,
      # which is exactly what we want to compile-check here.
      - name: Build debug + release, run unit tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            assembleDebug \
            assembleRelease \
            testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GothwadLauncher-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test + lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise failures
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo 'See the `reports-*` artifact for the lint and unit-test output.' >> "$GITHUB_STEP_SUMMARY"
