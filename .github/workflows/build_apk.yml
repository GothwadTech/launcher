name: Build Artifacts

# Manual, on-demand build of installable artifacts.
#
# This workflow used to also run on every push to main/master *and* publish a GitHub Release,
# which duplicated release.yml: two workflows created the same tag from independent run-number
# based version codes, and every push to main published a public release. Pushes are now covered
# by ci.yml (verification only) and releases by release.yml (tags). This one is purely
# "build me an APK/AAB I can sideload", signed when the keystore secrets exist.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.7 — empty = derive from the run number)'
        required: false
        default: ''
      version_code:
        description: 'Version code (empty = MAJOR*10000 + MINOR*100 + PATCH)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed APK, AAB and debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          version: ${{ inputs.version_name }}
          version-code: ${{ inputs.version_code }}
          ref-name: ${{ github.ref_name }}

      # Not required here: without the secrets this still produces installable debug artifacts.
      - name: Prepare release signing
        id: signing
        uses: ./.github/actions/prepare-signing
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          required: 'false'

      - name: Build
        run: |
          ./gradlew --no-daemon --stacktrace \
            assembleRelease bundleRelease assembleDebug \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          V_NAME="${{ steps.version.outputs.name }}"
          mkdir -p build_out

          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1 || true)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1 || true)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1 || true)"

          if [ -n "$APK" ]; then
            cp "$APK" "build_out/GothwadLauncher-v${V_NAME}-Release.apk"
          fi
          if [ -n "$AAB" ]; then
            cp "$AAB" "build_out/GothwadLauncher-v${V_NAME}-PlayStore.aab"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "build_out/GothwadLauncher-v${V_NAME}-Debug.apk"
          fi

          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
            echo "::warning::Release artifacts are UNSIGNED (no keystore secret configured)."
          fi
          ls -l build_out

      - name: Destroy the temporary keystore
        if: always()
        run: |
          KS="${{ steps.signing.outputs.keystore-path }}"
          if [ -n "$KS" ] && [ -f "$KS" ]; then
            rm -f "$KS"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Gothwad-Launcher-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          path: build_out/
          if-no-files-found: error
          retention-days: 30
