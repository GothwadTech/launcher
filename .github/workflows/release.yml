name: Release (Automatic & Tag-based)

# Publishes a GitHub Release with signed APKs & AAB.
# Triggers on push to main/master, v* tags, or manual run.

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g. 1.0.6 - leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate Gradle Wrapper
        run: |
          # The wrapper is committed and pinned (Gradle 8.10.2 == supported by AGP 8.5.x).
          # Never regenerate it here with a different version - that silently breaks the build.
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "❌ gradle/wrapper/gradle-wrapper.jar is missing from the repository."
            exit 1
          fi
          grep -q "gradle-8.10.2-bin.zip" gradle/wrapper/gradle-wrapper.properties || {
            echo "❌ Unexpected Gradle version in gradle-wrapper.properties (expected 8.10.2 for AGP 8.5.2)."
            grep distributionUrl gradle/wrapper/gradle-wrapper.properties
            exit 1
          }
          chmod +x ./gradlew

      - name: Determine Version Code and Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE=$(( 10 + ${{ github.run_number }} ))
          fi

          if [ -n "${{ inputs.version }}" ]; then
            V_NAME="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
          else
            V_NAME="1.0.${V_CODE}"
          fi

          echo "Determined Version Code: $V_CODE"
          echo "Determined Version Name: $V_NAME"
          echo "v_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK, Debug APK and AAB
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          if [ ! -f debug.keystore ]; then
            cp ~/.android/debug.keystore debug.keystore || keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          ./gradlew assembleRelease assembleDebug bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon

      - name: Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          mkdir -p release_out
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release_out/GothwadLauncher-v${V_NAME}-Debug.apk
            echo "Copied Debug APK: release_out/GothwadLauncher-v${V_NAME}-Debug.apk"
          fi

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::warning::RELEASE_KEYSTORE_BASE64 or KEYSTORE_PASSWORD secret is missing in GitHub Repository Secrets."
            echo "::notice::Falling back to debug keystore for signing so release artifacts are produced."
            KS_PATH="$HOME/.android/debug.keystore"
            if [ ! -f "$KS_PATH" ]; then
              KS_PATH="debug.keystore"
            fi
            ACTUAL_ALIAS="androiddebugkey"
            KEYSTORE_PASS="android"
            KEY_PASS="android"
          else
            KS_PATH="/tmp/release_key.jks"
            echo "Decoding permanent release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"

            # Dynamically detect exact Alias name from the keystore
            DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs)
            
            if [ -n "$KEY_ALIAS" ]; then
              ACTUAL_ALIAS="$KEY_ALIAS"
            elif [ -n "$DETECTED_ALIAS" ]; then
              ACTUAL_ALIAS="$DETECTED_ALIAS"
            else
              ACTUAL_ALIAS="gothwad_launcher_key"
            fi
          fi
          
          echo "Using Keystore Alias: $ACTUAL_ALIAS"

          ZIPALIGN=$(find $ANDROID_HOME/build-tools/ -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)
          
          if [ -n "$APK" ]; then
            UNALIGNED_TEMP="/tmp/unaligned_temp.apk"
            if [ -n "$ZIPALIGN" ]; then
              $ZIPALIGN -v -p 4 "$APK" "$UNALIGNED_TEMP" || cp "$APK" "$UNALIGNED_TEMP"
            else
              cp "$APK" "$UNALIGNED_TEMP"
            fi

            $APKSIGNER sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out release_out/GothwadLauncher-v${V_NAME}-Release.apk \
              "$UNALIGNED_TEMP"

            $APKSIGNER verify --verbose release_out/GothwadLauncher-v${V_NAME}-Release.apk
            rm -f "$UNALIGNED_TEMP"
          fi

          if [ -n "$AAB" ]; then
            cp "$AAB" release_out/GothwadLauncher-v${V_NAME}-PlayStore.aab
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \
              release_out/GothwadLauncher-v${V_NAME}-PlayStore.aab \
              "$ACTUAL_ALIAS"
            echo "Successfully signed Play Store AAB!"
          fi

          # Securely clean up temporary secret key if used
          if [ "$KS_PATH" = "/tmp/release_key.jks" ]; then
            rm -f "$KS_PATH"
            echo "Keystore securely cleaned up."
          fi

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gothwad-Launcher-v${{ steps.versioning.outputs.v_name }}-Release
          path: release_out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: v${{ steps.versioning.outputs.v_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_out/*
