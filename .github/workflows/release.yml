name: Release

# Publishes signed artifacts to a GitHub Release.
# Triggered by a version tag (v*) or manually. Compilation is verified on every PR by ci.yml;
# this workflow is only about signing and publishing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.7 — empty = derive from the tag / run number)'
        required: false
        default: ''
      version_code:
        description: 'Version code (empty = MAJOR*10000 + MINOR*100 + PATCH)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The debug build type uses a custom signing config that points at
      # ~/.android/debug.keystore, which AGP does not create for custom configs.
      - name: Create a debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-version
        with:
          version: ${{ inputs.version }}
          version-code: ${{ inputs.version_code }}
          ref-name: ${{ github.ref_name }}

      # Exports KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD so the Android
      # Gradle Plugin signs the APK and the AAB itself (v1+v2+v3). No apksigner/jarsigner step.
      - name: Prepare release signing
        id: signing
        uses: ./.github/actions/prepare-signing
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          required: 'true'

      - name: Build release APK, AAB and debug APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            assembleRelease bundleRelease assembleDebug \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          V_NAME="${{ steps.version.outputs.name }}"
          mkdir -p release_out artifacts_out

          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1 || true)"
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1 || true)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1 || true)"

          if [ -n "$APK" ]; then
            cp "$APK" "release_out/GothwadLauncher-v${V_NAME}-Release.apk"
          else
            echo "::error::No release APK was produced."
            exit 1
          fi
          if [ -n "$AAB" ]; then
            cp "$AAB" "release_out/GothwadLauncher-v${V_NAME}-PlayStore.aab"
          else
            echo "::error::No release AAB was produced."
            exit 1
          fi
          # The debug APK is a workflow artifact only, NOT part of the public release: it is
          # signed with a different key, so a user who installs it cannot upgrade to the signed
          # release without uninstalling first.
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts_out/GothwadLauncher-v${V_NAME}-Debug.apk"
          fi
          ls -l release_out artifacts_out

      - name: Verify APK signature
        run: |
          set -euo pipefail
          V_NAME="${{ steps.version.outputs.name }}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs \
            "release_out/GothwadLauncher-v${V_NAME}-Release.apk"

      # The temporary keystore must not survive the job, whatever happened above.
      - name: Destroy the temporary keystore
        if: always()
        run: |
          KS="${{ steps.signing.outputs.keystore-path }}"
          if [ -n "$KS" ] && [ -f "$KS" ]; then
            rm -f "$KS"
            echo "Temporary keystore removed."
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gothwad-Launcher-v${{ steps.version.outputs.name }}-debug
          path: artifacts_out/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release_out/GothwadLauncher-v${{ steps.version.outputs.name }}-Release.apk
            release_out/GothwadLauncher-v${{ steps.version.outputs.name }}-PlayStore.aab
