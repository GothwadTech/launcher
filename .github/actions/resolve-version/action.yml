name: Resolve version name and code
description: >
  Turns a git tag or a manual workflow input into a version name and a version code.
  The code is derived from the name (MAJOR*10000 + MINOR*100 + PATCH) so it always increases
  with the version - the previous "10 + workflow run number" scheme was per-workflow, so two
  workflows could publish the same code and a re-run could go backwards, which the Play Store
  rejects.

inputs:
  version:
    description: 'Explicit version name (empty = derive from the ref)'
    required: false
    default: ''
  version-code:
    description: 'Explicit version code (empty = derive from the version name)'
    required: false
    default: ''
  ref-name:
    description: 'Git ref name, e.g. v1.0.7'
    required: true
  fallback-base:
    description: 'Base added to the run number when no numeric version can be derived'
    required: false
    default: '10000'

outputs:
  name:
    description: 'Version name without the leading v, e.g. 1.0.7'
    value: ${{ steps.resolve.outputs.name }}
  code:
    description: 'Monotonic integer version code, e.g. 10007'
    value: ${{ steps.resolve.outputs.code }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: |
        set -euo pipefail

        RAW_NAME="${{ inputs.version }}"
        if [ -z "$RAW_NAME" ]; then
          case "${{ inputs.ref-name }}" in
            v*) RAW_NAME="${{ inputs.ref-name }}" ;;
            *)  RAW_NAME="1.0.${GITHUB_RUN_NUMBER}" ;;
          esac
        fi
        V_NAME="${RAW_NAME#v}"

        # 1.2.3 -> 10203 ; 1.0.7-beta -> 10007 ; anything unparseable -> 0
        DIGITS="$(printf '%s' "$V_NAME" | tr -cd '0-9.')"
        MA="$(printf '%s' "$DIGITS" | cut -d. -f1)"; MA="${MA:-0}"
        MI="$(printf '%s' "$DIGITS" | cut -d. -f2)"; MI="${MI:-0}"
        PA="$(printf '%s' "$DIGITS" | cut -d. -f3)"; PA="${PA:-0}"
        DERIVED=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#$PA ))

        if [ -n "${{ inputs.version-code }}" ]; then
          V_CODE="${{ inputs.version-code }}"
        elif [ "$DERIVED" -gt 0 ]; then
          V_CODE="$DERIVED"
        else
          V_CODE=$(( ${{ inputs.fallback-base }} + GITHUB_RUN_NUMBER ))
        fi

        echo "name=$V_NAME" >> "$GITHUB_OUTPUT"
        echo "code=$V_CODE" >> "$GITHUB_OUTPUT"
        echo "Resolved version ${V_NAME} (versionCode ${V_CODE})"
